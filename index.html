    body { margin: 0; background: #070e1b; color: #f1f5f9;

    [id^="screen-"] { min-height: 100vh; padding: 24px; }
    .dev-nav { position: fixed; bottom: 16px; right: 16px; z-index: 9999;
               display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  <script>
    function showScreen(id) {
      document.querySelectorAll('[id^="screen-"]').forEach(s => s.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
