  <style>
    /* ═══════════════════════════════════════
       DESIGN SYSTEM — ПрофНавигатор
       ═══════════════════════════════════════ */
    :root {
      --bg:      #070e1b;
      --card:    #0d1726;
      --accent:  #f97316;
      --amber:   #fbbf24;
      --blue:    #0ea5e9;
      --green:   #10b981;
      --indigo:  #6366f1;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --border:  rgba(255,255,255,0.07);
      --font:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --radius:  16px;
      --radius-sm: 10px;
      --transition: 0.3s ease;
    }

    /* ── СБРОС ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    img, svg { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    ul, ol { list-style: none; }

    /* ── ЭКРАНЫ ── */
    [id^="screen-"] { min-height: 100vh; }

    /* ── КОНТЕЙНЕР ── */
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .container--wide { max-width: 1140px; }

    /* ── ТИПОГРАФИКА ── */
    h1 { font-size: clamp(26px, 5vw, 44px); line-height: 1.15; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: clamp(22px, 4vw, 34px); line-height: 1.2;  font-weight: 700; }
    h3 { font-size: clamp(17px, 3vw, 22px); line-height: 1.3;  font-weight: 600; }
    p  { line-height: 1.65; }

    /* ── КНОПКИ ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: var(--radius-sm);
      font-size: 17px;
      font-weight: 700;
      min-height: 52px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--amber));
      color: #fff;
      box-shadow: 0 4px 24px rgba(249,115,22,0.35);
      animation: pulse 2s infinite;
    }
    .btn-primary:hover { box-shadow: 0 6px 32px rgba(249,115,22,0.55); }

    .btn-outline {
      border: 2px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }
    .btn-outline:hover { background: rgba(249,115,22,0.1); }

    .btn-ghost {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      padding: 10px 16px;
    }
    .btn-ghost:hover { color: var(--text); }

    .btn--full { width: 100%; }

    /* ── КАРТОЧКИ ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── СЕКЦИИ ── */
    .section { padding: 80px 0; }
    .section-sm { padding: 48px 0; }
    .section__title {
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── УТИЛИТЫ ── */
    .text-accent  { color: var(--accent); }
    .text-muted   { color: var(--muted); }
    .text-center  { text-align: center; }
    .text-green   { color: var(--green); }
    .flex-center  { display: flex; align-items: center; justify-content: center; }
    .gap-8  { gap: 8px; }
    .gap-16 { gap: 16px; }

    /* ══════════════════════════════════════
       АНИМАЦИИ
       ══════════════════════════════════════ */

    /* Пульсация CTA-кнопок */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(249,115,22,0.55); }
      70%  { box-shadow: 0 0 0 14px rgba(249,115,22,0); }
      100% { box-shadow: 0 0 0 0   rgba(249,115,22,0); }
    }

    /* Появление снизу при загрузке */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Появление при скролле (IntersectionObserver) */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Каскадные задержки для карточек */
    .fade-in[data-delay="1"] { transition-delay: 0.1s; }
    .fade-in[data-delay="2"] { transition-delay: 0.2s; }
    .fade-in[data-delay="3"] { transition-delay: 0.3s; }
    .fade-in[data-delay="4"] { transition-delay: 0.4s; }
    .fade-in[data-delay="5"] { transition-delay: 0.5s; }

    /* Слайд квиза — уход влево */
    @keyframes slideOutLeft {
      from { transform: translateX(0);     opacity: 1; }
      to   { transform: translateX(-100%); opacity: 0; }
    }

    /* Слайд квиза — приход справа */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    /* Слайд назад — уход вправо */
    @keyframes slideOutRight {
      from { transform: translateX(0);    opacity: 1; }
      to   { transform: translateX(100%); opacity: 0; }
    }

    /* Слайд назад — приход слева */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    .slide-out-left  { animation: slideOutLeft  250ms ease forwards; }
    .slide-in-right  { animation: slideInRight  250ms ease forwards; }
    .slide-out-right { animation: slideOutRight 250ms ease forwards; }
    .slide-in-left   { animation: slideInLeft   250ms ease forwards; }

    /* Появление микрокопии */
    @keyframes microFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Прогресс-бар результата — анимация заполнения */
    @keyframes fillBar {
      from { width: 0%; }
      to   { width: var(--target-width); }
    }

    /* Toast уведомление */
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(16px); }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      z-index: 10000;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }
    #toast.show {
      display: block;
      animation: toastIn 0.25s ease;
    }
    #toast.hide {
      animation: toastOut 0.25s ease forwards;
    }

    /* ── DEV-навигация (убрать перед релизом) ── */
    .dev-nav {
      position: fixed; bottom: 16px; right: 16px; z-index: 9999;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .dev-nav button {
      padding: 8px 12px;
      background: rgba(249,115,22,0.25);
      border: 1px solid rgba(249,115,22,0.5);
      color: var(--text);
      border-radius: 8px;
      font-size: 12px;
    }
    .dev-nav button:hover { background: rgba(249,115,22,0.45); }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ЛЕНДИНГ -->
  <section id="screen-landing" style="display:block">
    <h1>Лендинг — будет добавлен на Шаге 3</h1>
  </section>

  <!-- ЭКРАН 2: КВИЗ -->
  <section id="screen-quiz" style="display:none">
    <h1>Квиз — будет добавлен на Шаге 5</h1>
  </section>

  <!-- ЭКРАН 3: LOADING -->
  <section id="screen-loading" style="display:none">
    <h1>Загрузка — будет добавлена на Шаге 7</h1>
  </section>

  <!-- ЭКРАН 4: РЕЗУЛЬТАТ -->
  <section id="screen-result" style="display:none">
    <h1>Результат — будет добавлен на Шаге 8</h1>
  </section>

  <!-- DEV-навигация (убрать перед релизом) -->
  <nav class="dev-nav" aria-hidden="true">
    <button onclick="showScreen('screen-landing')">Landing</button>
    <button onclick="showScreen('screen-quiz')">Quiz</button>
    <button onclick="showScreen('screen-loading')">Loading</button>
    <button onclick="showScreen('screen-result')">Result</button>
  </nav>

  <script>
    function showScreen(id) {
      document.querySelectorAll('[id^="screen-"]').forEach(s => s.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>

</body>
